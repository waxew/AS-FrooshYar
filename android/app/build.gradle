plugins {
  id "com.android.application"
  id "kotlin-android"
  id "dev.flutter.flutter-gradle-plugin"
}

// Keep local developer settings optional so CI and fresh clones do not fail
// before Flutter has generated local.properties.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
  localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Release signing is optional during development. A publish build must provide
// android/key.properties and the matching keystore without committing secrets.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
  keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseSigning = keystorePropertiesFile.exists() && keystoreProperties['storeFile']

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: "1"
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: "1.0.0"
def buildNumber = System.getenv("BUILD_NUMBER") ?: "0"

android {
  namespace "com.asteam.frooshyar"
  compileSdkVersion flutter.compileSdkVersion
  ndkVersion flutter.ndkVersion

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_17
  }

  sourceSets {
    main.java.srcDirs += 'src/main/kotlin'
  }

  defaultConfig {
    applicationId "com.asteam.frooshyar"
    minSdkVersion = flutter.minSdkVersion
    targetSdkVersion flutter.targetSdkVersion
    multiDexEnabled true
    versionCode flutterVersionCode.toInteger()
    versionName flutterVersionName
  }

  signingConfigs {
    if (hasReleaseSigning) {
      release {
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
        storeFile file(keystoreProperties['storeFile'])
        storePassword keystoreProperties['storePassword']
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      if (hasReleaseSigning) {
        signingConfig signingConfigs.release
      }
    }

    debug {
      debuggable true
    }
  }

  flavorDimensions "mode"

  productFlavors {
    prod {
      dimension "mode"
    }

    dev {
      dimension "mode"
      versionNameSuffix "-dev+" + buildNumber
    }
  }

  lintOptions {
    disable 'InvalidPackage'
    checkReleaseBuilds false
  }

  packaging {
    jniLibs {
      useLegacyPackaging = false
    }
  }
}

flutter {
  source '../..'
}

dependencies {
  implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.21"
  implementation "androidx.multidex:multidex:2.0.1"
}
